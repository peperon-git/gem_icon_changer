<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gemアイコン変更</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <div>
        <h1>Gemアイコン変更</h1>
        <p>好きな画像をGemのアイコンに表示します。</p>
      </div>
      <label class="switch" title="アイコン変更を有効にする">
        <input id="enabled" type="checkbox" checked>
        <span></span>
      </label>
    </header>

    <main>
      <section class="editor">
        <label>
          Gem名
          <input id="gemName" type="text" placeholder="Geminiに表示されている名前">
        </label>

        <label>
          画像
          <input id="imageFile" type="file" accept="image/*">
        </label>

        <div id="preview" class="preview" aria-label="画像プレビュー"></div>
        <button id="saveGem" type="button">この画像を保存</button>
      </section>

      <section>
        <div class="section-title">
          <h2>保存済み</h2>
          <button id="clearAll" class="ghost" type="button">すべて削除</button>
        </div>
        <div id="emptyState" class="empty">まだ保存されたGemアイコンはありません。</div>
        <ul id="gemList"></ul>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
